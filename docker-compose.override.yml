services:
  ac-db-import:
    volumes:
      - ./modules:/azerothcore/modules:ro
      - ./data:/azerothcore/data:ro
  ac-authserver:
    ports:
      - "3724:3724"
  ac-worldserver:
    ports:
      - "8085:8085"
      - "7878:7878"
    volumes:
      - ./modules:/azerothcore/modules:ro
      - ./env/dist/etc:/azerothcore/env/dist/etc

