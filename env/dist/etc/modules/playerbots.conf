##################################################
# SKIRMISHCORE PLAYERBOTS OVERRIDES              #
# These values override playerbots.conf.dist     #
# See docs/CONFIGURATION.md for details          #
##################################################

# --- Population & Spawning ---
AiPlayerbot.MinRandomBots = 1000
AiPlayerbot.MaxRandomBots = 2000
AiPlayerbot.RandomBotMinLevelChance = 0.05
AiPlayerbot.RandomBotMaxLevelChance = 0.05

# --- Dynamic Level Brackets & Progression ---
AiPlayerbot.LevelBrackets.Enabled = 1
AiPlayerbot.LevelBrackets.Dynamic.UseDynamicDistribution = 1
AiPlayerbot.LevelBrackets.Dynamic.RealPlayerWeight = 10.0
AiPlayerbot.ResetBotLevel.Enabled = 1
AiPlayerbot.RandomBotMaps = 0,1

# --- Activity & Proximity ---
AiPlayerbot.BotActiveAlone = 100
AiPlayerbot.BotActiveAloneForceWhenInRadius = 400
AiPlayerbot.BotActiveAloneDurationSeconds = 45

# --- Bot Strategies & RPG Behaviors ---
AiPlayerbot.RandomBotCombatStrategies = "+pvp,-potions"
AiPlayerbot.RpgStatusProbWeight.GoGrind = 25
AiPlayerbot.RpgStatusProbWeight.OutdoorPvp = 30
AiPlayerbot.RpgStatusProbWeight.DoQuest = 40
AiPlayerbot.RpgStatusProbWeight.TravelFlight = 10
AiPlayerbot.RpgStatusProbWeight.WanderNpc = 20
